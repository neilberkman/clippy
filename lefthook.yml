# Git hooks, run by lefthook; installed by `just setup`.
# Checks come from the org base image (/opt/standards).
extends:
  - /opt/standards/lefthook/standards.yml
  - lefthook.override.yml

pre-commit:
  # This repository's own checks go here as more jobs, under names the shared file does not use.
  jobs:
    # lefthook skips a missing extends file without a word, so check that the package is there.
    - name: standards installed
      tags: [standards]
      run: test -f /opt/standards/lefthook/standards.yml
      fail_text: "run this inside the dev image: just check"

commit-msg:
  jobs:
    - name: standards installed
      tags: [standards]
      run: test -f /opt/standards/lefthook/standards.yml
      fail_text: "run this inside the dev image: just check"
