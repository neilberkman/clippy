name: PR Lint and Build

"on":
  pull_request:
  merge_group:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint-build:
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').macos || fromJSON('["macos-26"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Rubio-Enterprises/.github/actions/setup-just@main

      - name: Install mise if missing
        shell: bash
        run: |
          set -euo pipefail
          if command -v mise >/dev/null 2>&1; then exit 0; fi
          case "$(uname -s):$(uname -m)" in
            Darwin:arm64) ;;
            *) echo '::error::unsupported mise platform'; exit 1 ;;
          esac
          version=2026.11.1
          checksum=e1eaf20469e586f65849256a0be6a58dd7a3e93ae8db68bc74dd7af5ca0fe7f6
          work=$(mktemp -d "$RUNNER_TEMP/mise.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            "https://github.com/jdx/mise/releases/download/v$version/mise-v$version-macos-arm64.tar.gz" \
            -o "$work/mise.tar.gz"
          printf '%s  %s\n' "$checksum" "$work/mise.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/mise/bin"
          tar -xzf "$work/mise.tar.gz" -C "$RUNNER_TEMP" mise/bin/mise
          printf '%s\n' "$RUNNER_TEMP/mise/bin" >> "$GITHUB_PATH"
      - name: Set up native tools and Checks
        run: just setup-macos
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Check fork-owned Swift
        run: just check-macos
      - name: Lint fork changes
        env:
          LINT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: just lint-go
      - name: Build CLI tools
        run: just package
