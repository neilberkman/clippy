name: PR Tests

on:
  pull_request:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/clippy/testdata/**'
      - 'scripts/picker_snapshot_tmux.sh'
      - '.github/workflows/pr-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: |
          # Run tests sequentially to avoid clipboard conflicts between packages.
          go test -v -p 1 ./...

      - name: Ensure tmux is available
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            brew install tmux
          fi
          tmux -V

      - name: Run TUI snapshot regression
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            echo "tmux is required for TUI snapshot tests"
            exit 1
          fi
          ./scripts/picker_snapshot_tmux.sh

      - name: Install golangci-lint
        # Built from source: binaries must be built with a Go at least as new
        # as go.mod's, and install.sh misreads the checksums of recent
        # releases, which also list SBOM files.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Run linter
        run: golangci-lint run --timeout=5m

      - name: Build clippy
        run: go build -o clippy ./cmd/clippy

      - name: Build pasty
        run: go build -o pasty ./cmd/pasty

      - name: Verify builds work
        run: |
          ./clippy --version
          ./pasty --version

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: clippy-pasty-binaries-macos
          path: |
            clippy
            pasty
          retention-days: 7
