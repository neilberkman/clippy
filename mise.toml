# This repository's tools and tasks. The Checks, their tool pins and the Conformance Tasks (check,
# check:pr, fmt) come from @rubio-enterprises/standards, which `mise run setup` installs into
# .standards/ and mise loads through .config/mise/conf.d/standards.toml.
min_version = "2026.10.19"

[env]
# STANDARDS_VERSION = "1.4.2"  # Release Pin: hold this release while the latest breaks the repository; <issue link>
# STANDARDS_TEST_GATE = "off"  # Opt-out of the Test Gate; <reason>

[tools]
# This repository's language runtimes. Node runs the standards install and the npm: check tools.
node = "24.21.0"
go = "1.25.3"
# Upstream-compatible linter for lint:go and the golangci-lint Check (wins over the package pin).
"aqua:golangci/golangci-lint" = "2.15.0"

[tasks.setup]
description = "Install the standards package, its tools and the git hooks, then every setup:* task"
depends = ["standards:install"]
# `mise install` only when something is missing: on a machine with many tracked configs a no-op
# install still rebuilds every shim.
run = ['test -z "$(mise ls --missing)" || mise install', "mise exec -- lefthook install"]
# This repository's own setup steps (dependencies the Checks or Lifecycle Tasks need) are setup:*
# tasks; none is fine.
depends_post = [{ task = "setup:*", optional = true }]

# npm reads the token from NODE_AUTH_TOKEN itself, so it never appears in a command line. A shell
# that never read the profile (an agent's, an IDE task's) falls back to the GitHub CLI's token.
[tasks."standards:install"]
description = "Install the latest Standards Release (or the STANDARDS_VERSION Release Pin) into .standards/"
run = '''
if [ -z "${NODE_AUTH_TOKEN:-}" ] && command -v gh >/dev/null 2>&1; then
  NODE_AUTH_TOKEN=$(gh auth token 2>/dev/null) && export NODE_AUTH_TOKEN
fi
npm install --prefix .standards --no-save --prefer-online --fetch-retries=0 --no-audit --no-fund --ignore-scripts --loglevel=error "--@rubio-enterprises:registry=${STANDARDS_REGISTRY:-https://npm.pkg.github.com}" '--//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' "@rubio-enterprises/standards@${STANDARDS_VERSION:-latest}"
'''

# Lifecycle Tasks (test, typecheck, build, e2e) are this repository's own. `test` and `e2e` write
# reports/test/junit.xml; the Test Gate runs each one that exists.
# clippy and pasty use macOS APIs through cgo: build, test and lint:go need macOS.
[tasks.test]
description = "Uncached sequential Go tests (gotestsum, JUnit for the Test Gate) and the TUI snapshot"
run = [
  "mkdir -p reports/test",
  "gotestsum --junitfile=reports/test/junit.xml -- -count=1 -p 1 ./...",
  "bash scripts/picker_snapshot_tmux.sh",
]

[tasks.build]
description = "Build clippy and pasty on macOS"
run = "go build ./cmd/clippy ./cmd/pasty"

# The standards golangci-lint Check runs on the injected job's Linux runner; this runs the same
# linter on macOS, where the cgo code type-checks, over the fork's own changes.
[tasks."lint:go"]
description = "Lint fork changes without gating inherited upstream debt (macOS only)"
run = 'golangci-lint run --new-from-merge-base="${LINT_BASE_REF:-main}"'

[hooks]
enter = "test -f .standards/node_modules/@rubio-enterprises/standards/mise/standards.toml || echo 'standards: not installed; run mise run setup' >&2"
