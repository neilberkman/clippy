# treefmt bridge (from @rubio-enterprises/standards): lets coding agents and `treefmt <paths>`
# format exactly as the pre-commit Fixers do, by handing the paths to Lefthook.
tree-root-file = "treefmt.toml"
on-unmatched = "debug"

[formatter.lefthook]
command = "sh"
options = [
  "-c",
  '''
test -f /opt/standards/lefthook/standards.yml || { echo "treefmt: run this inside the dev image: just check" >&2; exit 1; }
printf '%s\0' "$@" | lefthook run pre-commit --tag fixer --no-stage-fixed --no-fail-on-changes --no-auto-install --files-from-stdin
''',
  "--",
]
includes = ["*"]
